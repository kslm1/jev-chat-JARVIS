name: Build Direct APK

on:
  push:
    branches:
      - direct-typesafe-deepseek
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk JevAssistant-Direct-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JevAssistant-Direct-debug
          path: JevAssistant-Direct-debug.apk
          retention-days: 14
